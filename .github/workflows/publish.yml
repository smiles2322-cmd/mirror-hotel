name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site (v2, arcade edition)
        run: |
          mkdir -p ../site
          cat v2/site.tgz.b64 v2/site.tgz.b64.p2 v2/site.tgz.b64.p3 v2/site.tgz.b64.p4 | base64 -d | tar -xzf - -C ../site
          if find ../site -ipath '*private*' | grep -q .; then echo "private files found, refusing to publish"; exit 1; fi
          grep -q "aurelian-game-v2" ../site/sw.js
          touch ../site/.nojekyll
          printf '%s\n' "Hotel Aurelian companion app by Smiles 2322" > ../site/pages.txt
          ls -laR ../site
      - name: Push to gh-pages
        run: |
          cd ../site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Hotel Aurelian v2 (arcade edition)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
